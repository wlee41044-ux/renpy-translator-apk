name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 태그 빌드 시 Release 생성용

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: pytest (engine)
        working-directory: engine
        run: python -m pytest -q

  apk:
    needs: engine-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # third_party/llama.cpp

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy 는 .pyc 컴파일에 앱과 같은 버전(3.12)의 Python 이 빌드 머신에 필요하다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          VER="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/rpytl-${VER}-debug.apk"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: rpytl-debug-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
